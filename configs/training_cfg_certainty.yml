data:
  name: pl_dock_guide
  # path: ./data/crossdocked_v1.1_rmsd1.0_pocket10
  path: /shared/healthinfolab/phz24002/AliDiff/data/crossdocked_v1.1_rmsd1.0_pocket10
  # split: /shared/healthinfolab/phz24002/AliDiff/data/crossdocked_pocket10_pose_split.pt
  split: /shared/healthinfolab/phz24002/AliDiff/data/crossdocked_pocket10_pose_split_dock_guide.pt
  index_path: /shared/healthinfolab/phz24002/AliDiff/data/crossdocked_v1.1_rmsd1.0_pocket10/index.pkl
  transform:
    ligand_atom_mode: add_aromatic
    random_rot: False
    condition_bins_path: /shared/healthinfolab/phz24002/AliDiff/data/condition_bins.yml  # generated by scripts/data_preparation/build_condition_bins.py
  test_path: ./data/test_set

model:
  diffusion_type: veda  # ['veda', 'edm_fm', 'ddpm']
  model_mean_type: C0  # ['noise', 'C0']
  beta_schedule: sigmoid

  # EDM coordinate parameters (VEDA)
  sigma_data: 10
  sigma_min: 0.001
  sigma_max: 800
  rho: 2.0

  # EDM sigma sampling parameters (training only)
  # sigma ~ LogNormal(P_mean, P_std^2) as per EDM paper
  edm_p_mean: -0.12   # mean in log-space
  edm_p_std: 1.70     # std in log-space


  # Discrete FM attribute parameters (VEDA)
  discrete_prior: uniform  # ['uniform', 'marginal']
  # DFM (Exact Discrete Flow Matching) parameters
  dfm_beta: 2  # noise injection for predictor-corrector
  dfm_type: campbell  # ['gat', 'campbell']
  mask_mode: uniform  # ['uniform', 'edm']
  beta_start: 1.e-7
  beta_end: 2.e-3
  v_beta_schedule: cosine
  v_beta_s: 0.01
  num_diffusion_timesteps: 100
  loss_pos_weight: 3.0
  loss_v_weight: 3.

  # --- Certainty Loss (v_loss auxiliary) ---
  # Penalizes entropy of correctly-predicted discrete tokens,
  # encouraging the model to be more confident when it is right.
  use_certainty_loss: true            # Enable certainty loss
  certainty_loss_weight: 0.1          # Global scale applied to total certainty-loss
  certainty_loss_atomics_weight: 1.0  # Per-type relative weight for atom-type certainty
  certainty_loss_sum_mode: false      # false = mean over correct positions (default);


  bond_loss: false
  bond_input: false
  use_bond_edge_feats: false   # Adopt Edge-to-Attention mechanism (VEDA-style)
  sample_bond: false
  loss_bond_weight: 0.1
  loss_non_bond_weight: 0.01   # suppress no-bond class dominance
  sample_time_method: symmetric  # ['importance', 'symmetric']
  use_condition: true           # Optional: enable condition conditioning
  condition_dropout: 0.5         # Optional: drop all conditions together during training
  condition_bins: 5              # Optional: number of bins per property
  condition_emb_dim: 8           # Optional: per-property embedding dim

  time_emb_dim: 64  # Required for VEDA (EDM noise embedding); use 0 for DDPM
  time_emb_mode: sin  # ['simple', 'sin'] - sin recommended for VEDA
  time_scheduler: log_uniform  # VEDA sampling: ['log_uniform', 'arcsin', 'edm', 'edm1']
  center_pos_mode: protein
  rescale_factor: 1.0

  veda_x_pred_mode: constant

  node_indicator: True
  model_type: uni_o2
  num_blocks: 1
  num_layers: 9
  hidden_dim: 128
  n_heads: 16
  edge_feat_dim: 4  # edge type feat
  num_r_gaussian: 20
  knn: 32 # !
  num_node_types: 8
  act_fn: relu
  norm: True
  cutoff_mode: knn  # [radius, none]
  ew_net_type: global  # [r, m, none]
  num_x2h: 1
  num_h2x: 1
  r_max: 10.
  x2h_out_fc: False
  sync_twoup: False

train:
  seed: 2021
  batch_size: 4
  num_workers: 4
  n_acc_batch: 1
  max_iters: 400000
  val_freq: 2000
  # Quick eval (sampling + full metrics) every N steps, logged to wandb
  quick_eval_freq: 10000
  quick_eval_num_proteins: 10
  quick_eval_num_ligands_per_protein: 10
  pos_noise_std: 0.1
  # pocket noise vs ligand EDM sigma:
  # fixed = pos_noise_std only
  # sigma_scaled = clamp(sigma * coeff, max)
  # sigma_sqrt_scaled = clamp(sqrt(sigma) * coeff, max)
  pocket_noise_mode: sigma_scaled   # fixed | sigma_scaled | sigma_sqrt_scaled
  pocket_noise_sigma_coeff: 0.1
  pocket_noise_max: 0.5
  max_grad_norm: 8.0
  optimizer:
    type: adam
    lr: 0.0001 #5.e-4
    weight_decay: 0
    beta1: 0.95
    beta2: 0.999
  scheduler:
    type: plateau
    factor: 0.6
    patience: 10
    min_lr: 1.e-6
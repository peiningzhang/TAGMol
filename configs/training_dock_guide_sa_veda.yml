data:
  name: pl_dock_guide
  path: ./data/guide/crossdocked_v1.1_rmsd1.0_pocket10
  split: ./data/guide/crossdocked_pocket10_pose_split_dock_guide.pt
  index_path: ./data/guide/crossdocked_v1.1_rmsd1.0_pocket10/index_props.pkl
  test_path: ./data/test_set  # for quick_eval docking
  transform:
    ligand_atom_mode: add_aromatic
    random_rot: False

model:
  diffusion_type: veda  # EDM + DFM noising (aligned with training.yml)
  model_mean_type: C0
  beta_schedule: sigmoid
  beta_start: 1.e-7
  beta_end: 2.e-3
  v_beta_schedule: cosine
  v_beta_s: 0.01
  num_diffusion_timesteps: 100  # used for validation sigma grid
  loss_v_weight: 100.
  sample_time_method: symmetric

  # EDM parameters (VEDA) - aligned with training.yml (score model)
  sigma_data: 1
  sigma_min: 0.0003
  sigma_max: 80
  rho: 2.0
  edm_p_mean: -1.86
  edm_p_std: 1.56

  # DFM parameters (VEDA) - aligned with training.yml
  discrete_prior: uniform
  dfm_beta: 2
  dfm_type: campbell
  mask_mode: uniform

  time_emb_dim: 64
  time_emb_mode: sin
  time_scheduler: log_uniform
  center_pos_mode: protein
  rescale_factor: 0.2  # aligned with training.yml (score model)

  node_indicator: True
  model_type: egnn
  num_blocks: 1
  num_layers: 9
  hidden_dim: 128
  n_heads: 16
  edge_feat_dim: 4
  num_r_gaussian: 20
  knn: 32
  num_node_types: 8
  act_fn: relu
  norm: True
  cutoff_mode: knn
  ew_net_type: global
  num_x2h: 1
  num_h2x: 1
  r_max: 10.
  x2h_out_fc: False
  sync_twoup: False
  update_x: False

  drop_protein_in_guide: True
  maximize_property: True

train:
  seed: 2021
  batch_size: 16
  num_workers: 4
  n_acc_batch: 1
  max_iters: 200000
  val_freq: 2000
  pos_noise_std: 0.1
  max_grad_norm: 8.0  # lower for guide stability (vs 8.0 in training.yml)
  bond_loss_weight: 1.0
  # Target normalization for docking score stability
  normalize_target: false
  # Quick eval (optional, like train_diffusion)
  quick_eval_freq: 10000
  quick_eval_num_proteins: 10
  quick_eval_num_ligands_per_protein: 10
  quick_eval_docking_mode: vina_score
  # Optional: path to score model checkpoint for guided quick_eval (skip if not set)
  score_model_checkpoint: logs_diffusion/training_2026_03_17__11_23_43/checkpoints/last.pt
  optimizer:
    type: adam
    lr: 0.0001
    weight_decay: 0
    beta1: 0.95
    beta2: 0.999
  scheduler:
    type: plateau
    factor: 0.6
    patience: 10
    min_lr: 1.e-6
  target: sa

sample:
  seed: 2021
  num_samples: 10
  num_steps: 1000
  pos_only: False
  center_pos_mode: protein
  sample_num_atoms: prior
  guide_kind: Kd
  gradient_scale_cord: 1.0
  gradient_scale_categ: -10.0
  clamp_pred_min: null
  clamp_pred_max: null

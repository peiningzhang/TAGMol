data:
  name: pl_dock_guide
  path: ./data/guide/crossdocked_v1.1_rmsd1.0_pocket10
  split: ./data/guide/crossdocked_pocket10_pose_split_dock_guide.pt
  index_path: ./data/guide/crossdocked_v1.1_rmsd1.0_pocket10/index.pkl
  transform:
    ligand_atom_mode: add_aromatic
    random_rot: False

model:
  diffusion_type: veda  # EDM + DFM noising (consistent with ScorePosNet3D VEDA)
  model_mean_type: C0
  beta_schedule: sigmoid
  beta_start: 1.e-7
  beta_end: 2.e-3
  v_beta_schedule: cosine
  v_beta_s: 0.01
  num_diffusion_timesteps: 100  # used for validation sigma grid
  loss_v_weight: 100.
  sample_time_method: symmetric

  # EDM parameters (VEDA)
  sigma_data: 10
  sigma_min: 0.001
  sigma_max: 800
  rho: 2.0
  edm_p_mean: -0.12
  edm_p_std: 1.70

  # DFM parameters (VEDA)
  mask_mode: uniform  # ['uniform', 'edm']

  time_emb_dim: 64  # recommended for VEDA (sin embedding of c_noise)
  time_emb_mode: sin
  center_pos_mode: protein

  node_indicator: True
  model_type: egnn
  num_blocks: 1
  num_layers: 9
  hidden_dim: 128
  n_heads: 16
  edge_feat_dim: 4
  num_r_gaussian: 20
  knn: 32
  num_node_types: 8
  act_fn: relu
  norm: True
  cutoff_mode: knn
  ew_net_type: global
  num_x2h: 1
  num_h2x: 1
  r_max: 10.
  x2h_out_fc: False
  sync_twoup: False
  update_x: False

train:
  seed: 2021
  batch_size: 16
  num_workers: 4
  n_acc_batch: 1
  max_iters: 200000
  val_freq: 2000
  pos_noise_std: 0.1
  max_grad_norm: 1.0  # aggressive clip to stabilize (was 8.0)
  bond_loss_weight: 1.0
  # Target normalization: Vina scores ~[-15, 2], reduces gradient magnitude
  normalize_target: true
  target_mean: -7.0
  target_std: 5.0
  optimizer:
    type: adam
    lr: 0.0005  # lower LR for stability (was 0.001)
    weight_decay: 0
    beta1: 0.95
    beta2: 0.999
  scheduler:
    type: plateau
    factor: 0.6
    patience: 10
    min_lr: 1.e-6
